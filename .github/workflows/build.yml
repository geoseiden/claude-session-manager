name: Build apps

# PyInstaller can't cross-compile, so each OS builds its own app here.
# Push a tag (git tag v1.0.0 && git push --tags) to get a release, or run this
# manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Re-pushing a tag supersedes the previous run for it rather than racing it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false          # a slow or broken runner must not sink the rest
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc = runs on more Linux distros
            asset: ClaudeSessionManager-linux-x86_64
            built: dist/ClaudeSessionManager
          - os: windows-latest
            asset: ClaudeSessionManager-windows-x64.exe
            built: dist/ClaudeSessionManager.exe
          - os: macos-14            # Apple Silicon
            asset: ClaudeSessionManager-macos-apple-silicon.zip
            built: dist/ClaudeSessionManager.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write             # each job publishes its own asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Name the asset
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.asset }}"

      # The release comes first: it is the actual deliverable, and GitHub's
      # artifact storage has been known to 403 mid-upload. Publishing here means
      # a flaky artifact service can never cost us the binary.
      # The first job to finish creates the release; the rest attach to it, so
      # nothing waits on the slowest platform.
      - name: Add to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
          body: |
            Download the file for your machine, then open it. Nothing to install.

            - **Windows** — `ClaudeSessionManager-windows-x64.exe`, double-click.
              SmartScreen may warn on an unsigned app: More info -> Run anyway.
            - **macOS** (Apple Silicon) — unzip, then **right-click the app -> Open**
              the first time (an unsigned app won't open on a plain double-click).
            - **Linux** — `chmod +x` the file, then run it.

            Builds are attached as each platform finishes, so a slow runner may mean
            one file arrives a few minutes after the others.

      # Secondary copy, so manual (non-tag) runs are still downloadable.
      # Non-blocking: the release above is what matters.
      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

name: Build apps

# PyInstaller can't cross-compile, so each OS builds its own app here.
# Push a tag (git tag v1.0.0 && git push --tags) to get a release with all four
# downloads, or run this manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc = runs on more Linux distros
            asset: ClaudeSessionManager-linux-x86_64
            built: dist/ClaudeSessionManager
          - os: windows-latest
            asset: ClaudeSessionManager-windows-x64.exe
            built: dist/ClaudeSessionManager.exe
          - os: macos-13            # Intel Macs
            asset: ClaudeSessionManager-macos-intel.zip
            built: dist/ClaudeSessionManager.zip
          - os: macos-14            # Apple Silicon
            asset: ClaudeSessionManager-macos-apple-silicon.zip
            built: dist/ClaudeSessionManager.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: python build.py
      - name: Name the asset
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ClaudeSessionManager-*
          body: |
            Download the file for your machine, then open it. Nothing to install.

            - **Windows** — `ClaudeSessionManager-windows-x64.exe`, double-click.
              SmartScreen may warn on an unsigned app: More info -> Run anyway.
            - **macOS** — unzip, then **right-click the app -> Open** the first time
              (an unsigned app won't open on a plain double-click).
            - **Linux** — `chmod +x` the file, then run it.
